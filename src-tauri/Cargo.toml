[package]
name = "gm"
version = "0.1.0"
description = "GM - launcher de sala tipo consola"
authors = ["Eduardo"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
